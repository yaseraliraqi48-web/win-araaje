<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>وين أراجع؟ V7 - جاهز للسوق</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#075985">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/854/854878.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@800;700;500&display=swap" rel="stylesheet">
<style>
:root{--blue:#075985;--bg:#eef6fb;--card:#fff;--border:#e2e8f0;--text:#0f172a;--muted:#64748b}
*{box-sizing:border-box;font-family:'Tajawal',sans-serif}body{margin:0;background:var(--bg);color:var(--text);padding-bottom:90px}
header{background:linear-gradient(0deg,rgba(7,89,133,.92),rgba(3,47,74,.88)),url('https://images.unsplash.com/photo-1553877522-43269d4ea984?q=80&w=1200') center/cover;color:#fff;padding:18px 20px 90px;text-align:center}
.page{max-width:820px;margin:-70px auto 0;padding:0 14px;position:relative;z-index:2;display:none}.page.active{display:block}
.search-wrap{background:var(--card);border-radius:20px;padding:14px;box-shadow:0 10px 28px #0001;border:1px solid var(--border)}
#searchInput{width:100%;padding:14px 16px;border:2px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text)}
.card{background:var(--card);border-radius:20px;padding:0;margin-bottom:14px;border:1px solid var(--border);overflow:hidden}
.card-content{padding:14px 16px}.card h2{margin:0 0 6px;font-size:16px;color:var(--blue)}
.service-btn{display:flex;justify-content:center;width:100%;text-decoration:none;color:#fff;padding:11px;border-radius:11px;font-weight:700;font-size:13px;margin-top:7px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 4px 10px;z-index:99;border-radius:22px 22px 0 0}
.tab{border:0;background:transparent;color:var(--muted);padding:8px 10px;border-radius:12px;font-size:10px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center}.tab.active{background:var(--blue);color:#fff}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick-card{background:var(--card);border-radius:16px;padding:12px;text-align:center;text-decoration:none;color:var(--text);border:1px solid var(--border)}.quick-card img{width:100%;height:60px;object-fit:cover;border-radius:10px;margin-bottom:6px}
#map{height:340px;border-radius:16px;border:2px solid var(--blue);margin-top:10px}
.chip{padding:5px 10px;border-radius:20px;font-size:11px;border:1px solid var(--border);background:var(--card);cursor:pointer}.chip.active{background:var(--blue);color:#fff}
</style>
</head>
<body>
<header><h1 style="margin:0">📍 وين أراجع؟</h1><p style="opacity:.9;font-size:12px">جاهز لسوق بلي - V7.1</p></header>
<div id="p-home" class="page active">
<div class="search-wrap"><input type="text" id="searchInput" placeholder="ابحث: متقاعد، جواز..." oninput="searchServices()"></div>
<div class="grid4" style="margin-top:12px">
<a class="quick-card" href="https://ur.gov.iq/" target="_blank"><img src="https://images.unsplash.com/photo-1573164713714-d95e436ab8d6?q=80&w=300"><b>🏛️ أور</b></a>
<a class="quick-card" href="#" onclick="openTab('p-retiree')"><img src="https://images.unsplash.com/photo-1559839734-2b71ea197ec2?q=80&w=300"><b>👴 متقاعد</b></a>
<a class="quick-card" href="https://ur.gov.iq/index/show-eservice/30020/28/org" target="_blank"><img src="https://images.unsplash.com/photo-1556388158-158ea5ccacbd?q=80&w=300"><b>🛂 جواز</b></a>
<a class="quick-card" href="https://spa.gov.iq/umbrella/search.aspx" target="_blank"><img src="https://images.unsplash.com/photo-1593113598332-cd288d649433?q=80&w=300"><b>👨‍👩‍👧 رعاية</b></a>
</div>
<div class="card" style="margin-top:12px;border-right:5px solid #ca8a04"><div class="card-content"><h2>👴 قسم المتقاعدين</h2><p>رواتب، إثبات حياة، فروع التقاعد، شكاوى 422</p><button class="service-btn" style="background:#ca8a04" onclick="openTab('p-retiree')">فتح القسم</button></div></div>
<div class="card" style="border-right:5px solid #f97316"><div class="card-content"><h2>🔔 تنبيه البيان السنوي</h2><input type="date" id="annualDate" style="width:100%;padding:10px;border-radius:9px"><button onclick="localStorage.setItem('annualDate',document.getElementById('annualDate').value);alert('✅ تم الحفظ')" style="width:100%;border:0;border-radius:9px;padding:11px;margin-top:8px;background:#f97316;color:#fff">💾 حفظ التنبيه</button></div></div>
<div class="card"><div class="card-content"><h2>🪪 البطاقة الوطنية</h2><a class="service-btn" style="background:#075985" href="https://ur.gov.iq/index/show-eservice/51434/16/org" target="_blank">فتح الخدمة</a></div></div>
</div>
<div id="p-retiree" class="page"><div class="card"><div class="card-content"><h2>👴 خدمات المتقاعدين الكاملة</h2><a class="service-btn" style="background:#ca8a04" href="https://ur.gov.iq/index/show-eservice/51023/10044/org" target="_blank">💰 استعلام راتب التقاعد</a><a class="service-btn" style="background:#075985" href="https://pension.iq/" target="_blank">🏛️ هيئة التقاعد الرسمي</a><a class="service-btn" style="background:#dc2626" href="tel:422">📞 اتصل 422</a><button class="service-btn" style="background:#666" onclick="openTab('p-home')">🔙 رجوع</button></div></div></div>
<div id="p-map" class="page"><div class="card"><div class="card-content"><h2>🗺️ الخريطة</h2><div id="map"></div><button class="service-btn" style="background:#666" onclick="openTab('p-home')">🔙 رجوع</button></div></div></div>
<div class="tabs">
<button class="tab active" onclick="openTab('p-home')">🏠<span>الرئيسية</span></button>
<button class="tab" onclick="openTab('p-map')">🗺️<span>الخريطة</span></button>
<button class="tab" onclick="openTab('p-retiree')">👴<span>المتقاعد</span></button>
</div>
<script>
function openTab(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById(id).classList.add('active')}
function searchServices(){const txt=document.getElementById('searchInput').value.toLowerCase();document.querySelectorAll('.card').forEach(c=>{c.style.display=c.innerText.toLowerCase().includes(txt)?'block':'none'})}
let map=L.map('map').setView([33.3152,44.3661],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js')}
</script>
</body>
</html>
